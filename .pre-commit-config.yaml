repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-xml
      - id: check-yaml
        args: [--unsafe]
      - id: detect-private-key
      - id: end-of-file-fixer
        # benchmarks/patches/** are byte-exact `git apply`-able artifacts
        # verified against their upstream tree; a trailing-newline fixup
        # would drift them from what was verified. See the trailing-
        # whitespace exclude below for the same reasoning in more detail.
        # benchmarks/results/** is RECORDED EVIDENCE, written by the harness
        # and by the stack under test: manifests whose contents ARE the
        # exclusion record, observer CSVs, and container launch logs. A
        # formatter that rewrites them alters the measurement after the fact.
        # Measured 2026-07-29 (Task 10): `pre-commit run --all-files` modified
        # 17 committed result files, manifest.json among them.
        # benchmarks/evidence/** carries the same hazard for its verbatim
        # captures and their producing scripts. See the trailing-whitespace
        # exclude below for the incident that proved it, the scoping
        # rationale (captures and scripts excluded; PROVENANCE.md/README.md
        # records are not), and the one .md file that is path-special-cased
        # because it is itself a verbatim capture, not authored narrative.
        exclude: ^benchmarks/(patches|results)/|^benchmarks/evidence/(?!.*\.md$)|^benchmarks/evidence/p3-phase0/probe-transcripts\.md$
      - id: mixed-line-ending
        # See the trailing-whitespace exclude below: any generic text
        # mutator is unsafe on these byte-exact patch files, and on the
        # recorded results for the reason given above -- and, per the same
        # exclude, on benchmarks/evidence/'s captures and scripts (plus one
        # path-special-cased .md file) too.
        exclude: ^benchmarks/(patches|results)/|^benchmarks/evidence/(?!.*\.md$)|^benchmarks/evidence/p3-phase0/probe-transcripts\.md$
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        # In a unified diff, a blank context line is one significant
        # space, not empty. This hook strips it, turning "- " (a
        # blank/whitespace-only context line) into "-", which can break
        # `git apply` on these byte-exact, verified patch artifacts.
        #
        # benchmarks/evidence/** carries the same hazard for its verbatim
        # captures, and it is not hypothetical: this hook stripped a trailing
        # space from a filed console log in commit cf072ea
        # (benchmarks/evidence/p4-task11-bringup/a-bringup-console.log,
        # docker compose's own " Container autoware Running " line -- see
        # that directory's own PROVENANCE.md and benchmarks/results/
        # PROVENANCE.md sec 16.3). A formatter that edits a filed capture
        # after the fact silently falsifies the "byte-exact" property the
        # capture exists to have.
        #
        # Scope is deliberately narrower than the blanket benchmarks/results/
        # exclude above: benchmarks/evidence/** also holds probe *scripts*
        # (e.g. p4-task11-bringup/capture_tier4_mount.py, b-vector-map-
        # delivery/cyclone_probe.sh) and *markdown records* (README.md, each
        # directory's PROVENANCE.md), neither of which is a captured
        # transcript.
        #   - Scripts ARE excluded here, for the same reason the ruff hooks
        #     below exclude all of benchmarks/evidence/: each PROVENANCE.md
        #     certifies specific scripts as the exact code that produced a
        #     specific filed figure (see e.g. b-vector-map-delivery/
        #     PROVENANCE.md's own table), and a whitespace/newline rewrite
        #     would falsify that certification exactly as a ruff reformat
        #     would.
        #   - PROVENANCE.md / README.md are deliberately NOT excluded: they
        #     are authored narrative, not captured transcripts (markdownlint
        #     already lints them -- only benchmarks/results/ is markdownlint-
        #     excluded below, not benchmarks/evidence/), and they benefit
        #     from the same whitespace/newline/line-ending hygiene as any
        #     other maintained prose in this repo.
        #
        # The extension split above is a HEURISTIC, not a guarantee: it
        # assumes .md under benchmarks/evidence/ is always authored narrative,
        # and that assumption already has a counterexample.
        # benchmarks/evidence/p3-phase0/probe-transcripts.md is the file's OWN
        # description of itself: "Every console block's output is
        # `tee`-appended unedited... Nothing was removed from any output for
        # being inconvenient." It carries 19 fenced ```console blocks that ARE
        # the record, and unlike every other evidence directory, p3-phase0/
        # has no companion .log/.txt holding that output a second time -- so
        # the extension rule would leave the one file that most needs this
        # protection unprotected. It is therefore special-cased into this
        # exclude by exact path, alongside the extension rule, not instead of
        # it.
        #
        # Checked and ruled OUT as needing the same treatment (2026-08-03):
        # every other fenced block under benchmarks/evidence/**/*.md is
        # either a ```bash recompute/reproduction snippet (g1-ladder-rigid,
        # g1-nishi-bundle, g2-nishi-cellc, route-town10-pre-repick,
        # task-15-adapi-engage-cellc, p3-phase0/PROVENANCE.md, README.md) or a
        # short ```text quoted excerpt (b-vector-map-delivery/PROVENANCE.md,
        # b-closed-loop-stopcheck/PROVENANCE.md) whose full, byte-exact source
        # is a companion .log/.txt file this exclude already protects --
        # mutating the .md quoting it does not falsify anything the campaign
        # cites as the record.
        #
        # A future .md filed under benchmarks/evidence/ needs the same
        # path-specific exclude if it is itself the PRIMARY, SOLE verbatim
        # capture of a session (raw console/tool output not also retained
        # byte-for-byte in a companion non-.md file). Check for that before
        # assuming the extension rule alone protects a new filing.
        exclude: ^benchmarks/(patches|results)/|^benchmarks/evidence/(?!.*\.md$)|^benchmarks/evidence/p3-phase0/probe-transcripts\.md$

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        args: [-c, .markdownlint.yaml, --fix]
        # --fix rewrites files, and run.sh writes a report.md INTO each run
        # directory. That file is part of the recorded run, not house-style
        # prose.
        exclude: ^benchmarks/results/

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        args: [--no-error-on-unmatched-pattern]
        # Verbatim copies of the lab repo's G0 interop contract; must stay
        # byte-identical to their source, not reformatted to house style.
        # benchmarks/config/autoware/** is the same class: each file there
        # is a verbatim copy of an Autoware image's own param file with a
        # named single-line change, and its whole reviewability is that
        # `diff` against the image's copy shows exactly that one line.
        # Measured 2026-07-30: prettier rewrote pose_initializer.param.yaml's
        # two 6x6 covariance blocks from 6 rows of 6 to 36 one-value lines --
        # semantically identical, and it turns a one-line diff into a
        # 120-line one, so the copy can no longer be checked against its
        # source by eye.
        # benchmarks/patches/** are byte-exact, verified `git apply`
        # artifacts: a unified diff's blank context line is one
        # significant space, and a mutating formatter can strip it,
        # breaking `git apply` even though the diff still "looks" the
        # same.
        exclude: ^(scripts/(expected_topics\.yaml|spike_stack\.json)|benchmarks/(config/autoware|patches|results)/)

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        # Same reasoning as the prettier exclude above, and the same two
        # kinds of file: verbatim copies whose value is that they are
        # byte-identical to a named source. Upstream's covariance blocks
        # column-align their values, which yamllint's `commas` rule reports
        # as "too many spaces after comma" 48 times per file; silencing it
        # inline would mean editing the copy, which is the one thing the copy
        # may not do. `check-yaml` still parses these files, so they are
        # validated as YAML -- only the house-style rules are waived.
        exclude: ^(scripts/expected_topics\.yaml$|benchmarks/config/autoware/)

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        # benchmarks/evidence/** is excluded for EXACTLY the reason the ruff
        # hooks below exclude it, and the reason the mutating hooks above
        # exclude its scripts: each directory's PROVENANCE.md certifies
        # specific scripts as the exact code that produced specific filed
        # figures ("the exact driver that produced the eighteen runs"), so a
        # lint-driven edit -- even adding a `# shellcheck disable=` line --
        # means the script in the tree is no longer the script that produced
        # the recorded figure.
        #
        # MEASURED 2026-08-04 (P4 Task 15 review, fix round 1): at b6fbc80,
        # BEFORE any change in that round, `pre-commit run --all-files`
        # already failed here, on
        # benchmarks/evidence/p4-task15-32ch-sweep/sweep_driver.sh:104 --
        # SC2016 (info) against a `down`-in-backticks message inside single
        # quotes, i.e. deliberate literal prose in an echo, not a defect. So
        # this exclude records a pre-existing condition rather than creating
        # a new allowance, exactly as the ruff exclude below does.
        #
        # The cost, stated plainly: shell under benchmarks/evidence/ is no
        # longer shellchecked. Anything meant to be maintained as code
        # belongs under benchmarks/scripts/ or scripts/, which stay covered.
        # If an evidence probe script is ever promoted to maintained code,
        # MOVE it there and leave the evidence copy untouched.
        exclude: ^benchmarks/evidence/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      # benchmarks/evidence/** is excluded for the SAME reason
      # benchmarks/results/** is excluded from the mutating hooks above, and
      # the evidence's own text is what establishes it: PROVENANCE.md calls
      # `probe_twist_components.py` "the script that produced it" and
      # `probe_chain_liveness.py`/`probe_velocity_status.py` "the exact
      # scripts, kept so the measurement is repeatable". A formatter that
      # rewrites them means the script in the tree is no longer the script
      # that produced the recorded figure -- the retention claim these
      # documents make would become false. Measured 2026-07-30 (Task 13
      # final): at acec485, BEFORE any change in this commit, `pre-commit run
      # --all-files` reformatted all three and left 2 unfixable E702s, so
      # this exclude records a pre-existing condition rather than creating a
      # new allowance.
      # The cost is stated plainly: Python under benchmarks/evidence/ is no
      # longer linted or formatted. Anything meant to be maintained as code
      # belongs under benchmarks/scripts/ or benchmarks/injector/, which are
      # both still covered.
      #
      # DO NOT "fix" this by deleting the exclude and letting ruff reformat
      # those files. benchmarks/evidence/ is RETAINED EVIDENCE, not
      # style-linted code, and each PROVENANCE.md certifies specific files as
      # the exact scripts that produced specific tracked figures.
      # Reformatting them would falsify that certification: the lint would go
      # green and the provenance claim would become false, which is strictly
      # worse than an unlinted directory. If a probe script there is ever
      # promoted to maintained code, MOVE it under benchmarks/scripts/ (where
      # it is linted) and leave the evidence copy untouched.
      - id: ruff
        args: [--fix]
        exclude: ^benchmarks/evidence/
      - id: ruff-format
        exclude: ^benchmarks/evidence/
