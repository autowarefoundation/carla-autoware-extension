# Bridge cells (E/E0/E-opt). The pinned artifact is the CUDA variant, NOT the
# CPU-only universe-devel the key name suggests: only that variant resolves
# autoware_ground_segmentation_cuda, so the bridge's perception can run at all.
# The key keeps its historical name because the documented build command reads
# pins['autoware_universe_devel']['digest'].
# GPU: this pin makes the image GPU-dependent -- every `docker run` of it (and
# of bridge_bench below) needs `--gpus all` and nvidia-container-toolkit; see
# benchmarks/patches/python-bridge/README.md.
autoware_universe_devel:
  image: ghcr.io/autowarefoundation/autoware:universe-devel-cuda
  digest: ghcr.io/autowarefoundation/autoware@sha256:5c22369a312f1cd8a03fb65b30c1ab542919c2c7a2cbd18e799956daef3ae8ee
# The image built from benchmarks/docker/bridge-bench.Dockerfile with
# --build-arg BASE=<autoware_universe_devel.digest>. It is never pushed, so the
# only identifier it has is the LOCAL image digest below (`docker images
# --digests`): it pins what a run used on this workstation, but it is not a
# pullable reference, and a rebuild elsewhere must be re-recorded.
bridge_bench:
  tag: bridge-bench:latest
  local_digest: sha256:b734b9af2ac6527284b07d8986261d4c360cf4d0f4d18900be7a13ebb4cb4123
# The image built from benchmarks/docker/bridge-bench-patched.Dockerfile:
# bridge_bench above plus the two committed python-bridge patches (0001, the
# pre-registered named exception in benchmarks/README.md, and 0002, the
# harmonized sensor config). Cells E and E-opt run THIS image; cell E0 keeps
# the unpatched bridge_bench, which is the whole point of having two tags.
# Like bridge_bench it is never pushed, so the only identifier it has is the
# LOCAL image digest below (`docker image inspect --format '{{.Id}}'`, the same
# identifier kind as bridge_bench.local_digest): it pins what a run used on
# this workstation, but it is not a pullable reference, and a rebuild elsewhere
# must be re-recorded.
# GPU: inherits bridge_bench's CUDA base, so every `docker run` of it needs
# `--gpus all` and nvidia-container-toolkit.
bridge_bench_patched:
  tag: bridge-bench-patched:latest
  local_digest: sha256:6d65be77784dfa0cf85da1ba7bf8e877f0ec4c0d6a50e339eb81204d27e14220
  patches:
    - 0001-lidar-is-dense.patch
    - 0002-sensor-config-harmonized.patch
  patches_sha256:
    0001-lidar-is-dense.patch: b7fa7e84e958f9a15f16754aab686ac9e2a87f72a189eb778d550f6bfff2b637
    0002-sensor-config-harmonized.patch: 93aaaff414ba032a6965a95735244e51f44aed725db269c1ce5c57053dc60298
# Images built from benchmarks/docker/bench-observer.Dockerfile, one label
# per pinned base. Never pushed, so the only identifier each has is the
# LOCAL image digest below (`docker images --digests`): it pins what a run
# used on this workstation, but it is not a pullable reference, and a
# rebuild elsewhere must be re-recorded. Unlike bridge_bench/
# autoware_universe_devel, the container never touches CUDA (rclcpp-only
# recording/publishing nodes), so building and running it needs no
# --gpus all / nvidia-container-toolkit -- verified live (see task-5
# report): both `docker build` and the contract test's `docker run`
# succeeded with no GPU flags against the CUDA base image.
bench_observer_images:
  universe-devel:
    base: autoware_universe_devel.digest # built now (serves cells A/B/C/D/E/CAL)
    tag: bench-observer:universe-devel
    # REBUILT 2026-07-29 (R3), same base digest, new observer source:
    # bench_observer.cpp gained the typed `pose` kind (the NDT pose ->
    # pose.csv, without which M5's registered pose_error had no data source at
    # all) and the typed `tf` kind (child_frame_id-filtered -> tf.csv), and it
    # now writes odometry/pose positions in fixed 4-decimal notation instead of
    # std::ostream's default 6 significant digits. The previous digest for this
    # label was
    # sha256:805d2e345d0b33a0a6dadfe06fa76d8caa99a737ebe94a3d4d9748ed190af54b;
    # it writes neither new file, so no P3 measurement run may use it.
    # MEASURED while re-pinning this: the local digest is NOT reproducible from
    # the source alone even when every layer is a cache hit -- BuildKit stamps a
    # fresh creation time and attestation into the manifest, so a second
    # `docker build` of byte-identical content yields a different id. The value
    # below is the image the contract test
    # (BENCH_E2E=1 tests/benchmarks/test_observer_contract.py) was run green
    # against; treat it as "which build a run used", never as a content hash.
    local_digest: sha256:b78ec01af5c4229b2fe803abcb11be298699bed2eb1de7700f934c476d6a5385
    # bench-observer:045, base = autoware_045.digest, built in Task 21 once
    # B45's disk is freed. Task 21 builds it from THIS observer source, so it
    # carries the two new kinds as well.
# Cell B45: the tier4 native path is documented against Autoware 0.45.1 and
# sensor_model:=awsim_sensor_kit. There is NO universe-devel-cuda-0.45.1 tag;
# the newest CUDA-enabled 0.45.x is universe-devel-cuda-0.45.0, recorded below
# as the fallback should B45 turn out to need CUDA perception.
autoware_045:
  image: ghcr.io/autowarefoundation/autoware:universe-devel-0.45.1
  digest: ghcr.io/autowarefoundation/autoware@sha256:6afe9ee4a25a1082685c266f96dabd6041e77424bf10ea729bd488e02ae92175
  amd64_digest: sha256:61ee4e281df852f63b8085b61d136ea4e9844f5894ba41df949bc7919cda5cba
  cuda_fallback_image: ghcr.io/autowarefoundation/autoware:universe-devel-cuda-0.45.0
  cuda_fallback_digest: ghcr.io/autowarefoundation/autoware@sha256:3a8d92856174dcb6f4d9a73e946132864b3bd1a74bc603d8aed7536f5b6bcb82
# A carla-unreal-editor rebuild in ANY tree relinks the shared engine's
# own modules too (UnrealEditor.modules bumps a fresh unified BuildId
# across the engine AND every downstream Carla tree it touches) -- this
# is a known, budgeted side effect (P1 Verdict 3 / decision D8), not a
# deliberate engine build. This pin is the BuildId every preflight must
# match against; a mismatch means that tree's editor modules are stale
# and need their own carla-unreal-editor rebuild before it will boot.
# This value settled after two follow-up rounds past Task 4's own
# rebuild (extension rebuild bumped it again, tier4 rebuild held it
# steady) -- see the Task 4 report's fix-report section. No further
# engine relink is permitted from here on (D8).
engine:
  build_id: 4210e602-78ec-46e1-8f2f-03fadbe036a3 # settled value, all 3 trees agree
