# A carla-unreal-editor rebuild in ANY tree relinks the shared engine's
# own modules too (UnrealEditor.modules bumps a fresh unified BuildId
# across the engine AND every downstream Carla tree it touches) -- this
# is a known, budgeted side effect (P1 Verdict 3 / decision D8), not a
# deliberate engine build. This pin is the BuildId every preflight must
# match against; a mismatch means that tree's editor modules are stale
# and need their own carla-unreal-editor rebuild before it will boot.
# This value settled after two follow-up rounds past Task 4's own
# rebuild (extension rebuild bumped it again, tier4 rebuild held it
# steady) -- see the Task 4 report's fix-report section. No further
# engine relink is permitted from here on (D8).
engine:
  build_id: 4210e602-78ec-46e1-8f2f-03fadbe036a3 # settled value, all 3 trees agree
