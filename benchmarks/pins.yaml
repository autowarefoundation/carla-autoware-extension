autoware_contents:
  revision: 062f94b5322e679ee0430e2daa6995dca9f7f0ea
  town10_pcd_sha256: 7ed7890ebe983b324758835336264dcc6b7f736e51498101262e91de49eee95b
  town10_osm_sha256: cdd0a28664bcf9b5bd8867584a6fa6a02fa0f75a7c3dbb901ca216128ef86a17
# The Town10 pointcloud, rigid-shifted by dy_m to correct the +0.475 m
# cross-track offset the P1 seed sweep localized to this file (see
# task-11-brief.md / task-S2-brief.md). Reproducible from this pin alone:
# fetch autoware_contents' town10 revision, then re-run
# `tool`@`tool_commit` with `--dy <dy_m>` against the file matching
# `source_sha256`.
# Note: `sha256` is the OUTPUT file's hash -- it is not comparable to
# `source_sha256` on size or bytes. The source is compressed `DATA
# binary_compressed` (110 MiB); shift_pcd.py never re-compresses, so the
# shifted output is uncompressed `DATA binary` and larger (~114 MiB) even
# though it holds the same point count. Sizes are MiB here and in
# shift_pcd.py -- the unit `ls -h` prints, so the two agree with each
# other and with the files on disk.
town10_pcd_shifted:
  source_sha256: 7ed7890ebe983b324758835336264dcc6b7f736e51498101262e91de49eee95b
  dy_m: -0.475
  tool: benchmarks/scripts/shift_pcd.py
  tool_commit: 5dd60d1
  sha256: bed9c2cd7045d12891b1da892939565d73a4b733e6e24e3475d1027f3fa9dab2
# The G1 ladder's rung-1 REFIT of the block above, measured live on
# 2026-07-29 (Task 11). The dy = -0.475 bundle left a clean constant
# cross-track residual of +0.132 m -- read, as the pre-shift sweep read it,
# on the cleanly-converged seeds (4/8 with |err_dx| < 0.5: err_dy mean
# +0.1318, std 0.0123, against +0.005 across all 8) -- so rung 1's
# precondition fired and this is the re-shift by that new mean.
#
# dy_m is the TOTAL offset from the SOURCE, not an increment on the block
# above: -0.475 + (-0.132) = -0.607, applied single-hop to the file
# matching `source_sha256`, so this block reproduces on its own exactly
# like its predecessor and the provenance chain stays one hop deep.
#
# tool_commit deliberately DIFFERS from the block above: shift_pcd.py was
# modified after 5dd60d1 (eda5f4f length-check, b2e1223, 67cd3c4), so the
# tool that produced THIS output is the one at the commit below, and
# reusing 5dd60d1 here would name a tool revision that did not run.
#
# WHY A SECOND BLOCK RATHER THAN AN EDIT: both blocks describe candidate
# contents of the ONE path map_defaults.sh resolves and docker/compose.yaml
# mounts (~/autoware_map/town10-shifted/pointcloud_map.pcd), and exactly
# one can be installed there at a time. Overwriting the block above would
# have destroyed the only record of the bundle both recorded G1 windows and
# the recorded G2 run were measured against. So the invariant a reader and
# a preflight can both rely on is: the file at that path hashes to the
# `sha256` of EXACTLY ONE block here, and that block is the bundle the run
# used. It is not "whichever block is listed last".
#
# The dy = -0.475 bytes are retained on disk as
# ~/autoware_map/town10-shifted/.pointcloud_map.dy-0.475.bak (kept, not
# deleted: it is the byte-exact artifact the block above pins, it makes
# reverting the ladder a move rather than a re-derivation, and 114 MiB is
# free on a filesystem with 420 GB spare).
town10_pcd_refit:
  source_sha256: 7ed7890ebe983b324758835336264dcc6b7f736e51498101262e91de49eee95b
  dy_m: -0.607
  tool: benchmarks/scripts/shift_pcd.py
  tool_commit: 13a3719
  sha256: 38b10c3a8f4e50f4b828222562d4d9ff04de71f8e1711a21d4b2c0b3145c0401
# The G1 ladder's RUNG-2 bundle, and the one the Town10 cells now localize
# against (scripts/e2e/map_defaults.sh points Town10HD_Opt at it). Rebuilt from
# ground-truth-registered LiDAR sweeps rather than RE-REGISTERED: rung 1's rigid
# refit above still measured max NDT error 0.570 m against the 0.5 m absolute
# gate, and this bundle measures 0.089 m. It lives in its own directory
# (~/autoware_map/town10-regen) rather than displacing a rigid variant, because
# it is not a re-registration of that source at all.
#
# NOT reproducible from this pin alone, and that is a property of the METHOD,
# not an omission: the input is a live 100 s drive, so a rebuild yields a
# different point set. What the pin fixes is WHICH FILE a run used (`sha256`)
# plus the parameters that shaped it, which is the same standard
# bench_observer_images' local_digest already documents for a non-content hash.
#
# COVERAGE IS BOUNDED BY WHERE THE EGO DROVE. The collection drive reached
# ~292 m of the then-438.9 m route before the rigid bundle's own localization
# stopped it, so this bundle is dense along that corridor and thins beyond it.
# The RETAINED evidence for that is the closed-loop outcome, not a point count:
# on the full 438.9 m route the ego closed only to 1.929 m and was stopped
# before arrival (benchmarks/evidence/g2-regen-committed-route/), while on the
# re-picked 258.9 m route -- entirely inside the collection corridor -- it
# reached 0.244 m (benchmarks/evidence/g2-regen-repicked-route/). Both numbers
# are recomputable from the retained distance series.
# An earlier revision of this comment also cited an NDT-score breach
# distribution over that drive. That was observed live but its source log lived
# inside a container that has since been removed, so it is NOT retained and is
# no longer offered as evidence here.
# This bound is why the Town10 route was re-picked to end at station 258.9 m
# (config/routes/Town10HD_Opt.yaml), and why a future full-route bundle needs a
# second collection pass over the remainder.
town10_pcd_regen:
  built_on_bundle_sha256: 38b10c3a8f4e50f4b828222562d4d9ff04de71f8e1711a21d4b2c0b3145c0401
  tool: benchmarks/scripts/build_pcd_from_gt.py
  tool_commit: 85d6d45
  window_s: 100
  voxel_m: 0.2
  lidar_channels: 128
  lidar_points_per_second: 2200000
  lidar_range_m: 100
  sweeps: 1996
  points: 1990168
  sha256: c3bc613b0ea3e77528d081792dedc6fa0a22a89ae10aeabe5c72a09afcbfaba3
# The Nishi-Shinjuku bundle cells C/D localize against
# (~/autoware_map/nishishinjuku, via scripts/e2e/map_defaults.sh). Added
# 2026-07-29 so those cells have registered provenance at all: the bundle-pin
# check is scoped per bundle DIRECTORY and an unregistered directory SKIPS
# rather than fails, so without this block C/D would run with no provenance
# recorded and nothing would notice the bundle changing under them.
#
# UPSTREAM IS RECORDED, and an earlier revision of this comment wrongly said it
# was not. docs/nishishinjuku-map.md and docs/e2e-report.md both name the source
# -- AWSIM v2.0.0 `Shinjuku-Map.zip`, 129,585,415 bytes, with the release URL --
# so `upstream` below is filled from them rather than left null. Recorded as the
# correction it is: the claim of absence was made without reading the docs that
# hold it, which is the same class of error as citing evidence that does not
# exist, in its inverted form.
#
# WHAT REMAINS A GAP, narrowly: there is no fetch-and-verify script for this
# bundle (fetch_maps.sh covers Town10 only), so nothing re-derives these digests
# from `url` the way autoware_contents' are re-derived. The zip's own byte size
# is pinned below as the one upstream-side check available without a fetcher.
# A Nishi equivalent of fetch_maps.sh is future work and belongs with whoever
# owns that map.
#
# ENFORCEMENT, stated exactly: only `pcd_sha256` has a consumer --
# benchmarks/scripts/bundle_pin.py checks it via BUNDLE_REGISTRY, so an edited
# or swapped POINTCLOUD is refused rather than measured and silently attributed
# to the map C/D's numbers are filed under. `osm_sha256`,
# `projector_info_sha256` and `zip_bytes` are RECORDED BUT NOT ENFORCED: nothing
# reads them today, so a changed lanelet2 map or projector info would not be
# caught here. They are kept because recording them costs nothing and a later
# consumer can adopt them, not because they are currently checked.
nishishinjuku_bundle:
  # The enforced one (bundle_pin.py / BUNDLE_REGISTRY).
  pcd_sha256: 78b6cf81047489efb1f008a44238d497241da64bb158c824a3f18f23eb50e9d3
  # Recorded, NOT enforced -- no consumer reads the three below.
  osm_sha256: a064a60cc6d866ff2cfec8d3100886b5e7fd5fa83019b2729d9413809c62d39e
  projector_info_sha256: c735f3f8ebb08f3a891b914c19d7d5f7d6c7cb0a83177dd57798d1eafaaa6d4f
  zip_bytes: 129585415
  package_name: shinjuku_map
  upstream: https://github.com/autowarefoundation/AWSIM/releases/download/v2.0.0/Shinjuku-Map.zip
  upstream_release: AWSIM v2.0.0
  # License travels with the data; the bundle is referenced in place, never
  # committed (docs/nishishinjuku-map.md).
  license: CC BY-NC 4.0
