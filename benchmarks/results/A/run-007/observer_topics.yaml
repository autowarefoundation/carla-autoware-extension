# bench_observer topic list for cell A (extension approach).
#
# The four M2/M5 topics: the injection point (the extension's
# as-emitted LiDAR topic), the NDT pose, the fused kinematic state
# (typed, so odometry.csv gets x/y for the M5 window), and the GATED
# control output -- /control/command/control_cmd, what vehicle_cmd_gate
# actually sends, NOT /control/trajectory_follower/control_cmd, the raw
# planner output that flows even while the gate suppresses everything.
#
# PublishedTime: DISCOVERED LIVE 2026-07-30 (Task 15b), on THIS cell's own
# running stack -- `ros2 topic list --no-daemon | grep published_time` inside
# docker/compose.yaml's `autoware` container during results/A/run-002, the
# first cell-A run ever filed through benchmarks/run.sh. This is the LAST
# pre-registration edit to this file. It closes the gap Task 13 deliberately
# left: Task 13 had the names, but from CELL B's stack, and cell B runs
# pins.yaml's universe-devel-cuda DIGEST while cell A runs
# `ghcr.io/autowarefoundation/autoware:universe-devel` -- topic existence at
# run time is a property of the image's own launch configuration, so a name
# observed on one image is not a measurement of the other. Registering B's
# names as A's would have filed a claim as a check. They are now measured
# here, on A, and they agree.
#
# MEASURED, twice, at two RUN PHASES -- and the phase turned out to matter,
# which is itself the finding:
#
#   BEFORE the ego was armed (probe 1, immediately after `launch_autoware.sh`
#   reported the stack up and /autoware_carla_interface fired-and-died) --
#   SIX topics, and NOT the control one:
#     /sensing/lidar/top/self_cropped/pointcloud_ex/debug/published_time
#     /sensing/lidar/top/mirror_cropped/pointcloud_ex/debug/published_time
#     /sensing/lidar/top/pointcloud_before_sync/debug/published_time
#     /localization/util/measurement_range/pointcloud/debug/published_time
#     /localization/util/voxel_grid_downsample/pointcloud/debug/published_time
#     /localization/util/downsample/pointcloud/debug/published_time
#
#   AFTER arming (probe 2, right after arm_and_goal.py reported ARMED) --
#   SIXTEEN, the six above plus:
#     /control/command/control_cmd/debug/published_time          <- registered
#     /control/trajectory_follower/control_cmd/debug/published_time
#     /planning/trajectory/debug/published_time
#     /planning/scenario_planning/lane_driving/trajectory/debug/published_time
#     /planning/scenario_planning/scenario_selector/trajectory/debug/
#       published_time
#     /planning/scenario_planning/velocity_smoother/trajectory/debug/
#       published_time
#     /planning/scenario_planning/lane_driving/behavior_planning/path/debug/
#       published_time
#     /planning/scenario_planning/lane_driving/behavior_planning/
#       path_with_lane_id/debug/published_time
#     /planning/scenario_planning/lane_driving/motion_planning/path_optimizer/
#       trajectory/debug/published_time
#     /planning/scenario_planning/lane_driving/motion_planning/path_smoother/
#       path/debug/published_time
#
# So a PublishedTime topic's existence is a function of RUN PHASE, not of the
# image alone: the ten that appear only after arming are the planning/control
# chain's, and they do not exist while the ego is parked with no route. A probe
# taken before arming would have recorded the control topic as ABSENT for this
# cell and left control_staleness_ms unregisterable -- which is exactly what
# probe 1 alone would have concluded. Recorded so the next probe is timed
# rather than lucky.
#
# The TYPE was read off the wire for the registered topic itself, not inferred:
# `ros2 topic info --no-daemon /control/command/control_cmd/debug/
# published_time` returned `Type: autoware_internal_msgs/msg/PublishedTime`,
# `Publisher count: 1`, on this cell's own image -- independently confirming
# Task 13's refutation of the plan's `autoware_internal_debug_msgs` assumption.
# The other fifteen carry the same type by INFERENCE (one
# PublishedTimePublisher implementation emits all of them), not by a second
# measurement -- the same distinction B.yaml draws.
#
# ONE row is added -- the control one -- because it is the only PublishedTime
# topic a registered metric reads: control_staleness_ms (M1b) keys
# published_time.csv by metrics.control_published_time_topic. The other fifteen
# are recorded above rather than subscribed; each would be another observer
# subscription on the measured host, feeding a number nothing computes.
#
# STILL OWED, and NOT done here: cells.yaml's cell-A
# `control_published_time_topic` binding is still null and is TASK 20's
# (cells.yaml names it). This file now records the observation that unblocks
# it, but until that binding is filled `control_staleness_ms` stays UNAVAILABLE
# for cell A -- and therefore for the WHOLE A-vs-B duel row, since
# duel_verdict.build_verdict_table reports a metric unavailable when either
# side is unbound.
#
# One construction FINDING already applies to this cell as much as to B: the
# injection topic /sensing/lidar/top/pointcloud_raw_ex has NO PublishedTime
# companion and cannot have one, because CARLA publishes it while
# PublishedTimePublisher is an Autoware-side facility. See B.yaml.
#
# Format: "<topic>|<type>|<kind>", or "<topic>|<type>|<kind>|<arg>" for a kind
# that takes an argument; kind in generic|odometry|pose|tf|published_time
# (benchmarks/observer/src/bench_observer.cpp). `generic` records serialized
# size. The typed kinds record the 0 size sentinel in observer.csv and also
# write their own file: `odometry` -> odometry.csv, `pose` -> pose.csv, `tf` ->
# tf.csv (whose fourth field is the child_frame_id it filters on).
# out_dir is supplied by run.sh as -p out_dir:=/out, not from this file.
#
# AMENDED 2026-07-29 (R3, before any P3 run), extending the history above: the
# NDT pose line's kind is the typed `pose` kind, not `generic`. A generic
# subscription records stamp + serialized size only, so no NDT x/y was
# recorded anywhere in the campaign and M5's registered `pose_error_m` -- NDT
# pose minus CARLA ground truth -- had no data source at all.
/**:
  ros__parameters:
    topics:
      - /sensing/lidar/top/pointcloud_raw_ex|sensor_msgs/msg/PointCloud2|generic
      - /localization/pose_estimator/pose_with_covariance|geometry_msgs/msg/PoseWithCovarianceStamped|pose
      - /localization/kinematic_state|nav_msgs/msg/Odometry|odometry
      - /control/command/control_cmd|autoware_control_msgs/msg/Control|generic
      - /control/command/control_cmd/debug/published_time|autoware_internal_msgs/msg/PublishedTime|published_time
