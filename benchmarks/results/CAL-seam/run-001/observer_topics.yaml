# bench_observer topic list for cell CAL-seam (calibration approach).
#
# WAS DELIBERATELY EMPTY -- the topics did not exist yet.
#
# CAL-seam measures the extension's in-core seam against an equivalent
# out-of-core publisher, and that publisher PAIR was Task 14 ("CAL-seam
# publisher pair"), which had not been written when this file was first
# committed. Nothing committed anywhere in this repo named the topics it
# would publish on, so any entry here would have been a guess -- and a
# guessed topic name records as silence (zero rows), which reads downstream
# as "this transport delivered nothing" instead of as a configuration error.
# An empty list was the honest state at that time: the observer still
# recorded /clock.
#
# STRUCK 2026-07-30 by the owner's core-duel scope cut (cells.yaml
# `dropped:`; benchmarks/README.md's 2026-07-30 amendment), which took Task
# 14's live half and Task 17 with it. Nothing filled this file in, no
# CAL-seam run was filed, and C1(a) seam overhead stayed UNMEASURED. An owner
# TIME-BUDGET decision, not a technical block: Task 14's CODE half landed and
# its spec DID name the pair's topics (/bench/seam_cloud and
# /bench/incore_cloud -- benchmarks/patches/extension/README.md), so they
# were no longer unknown; they simply were not going to carry traffic.
#
# REINSTATED 2026-08-03 (Task 8, P4 transport-sweep plan), on the D8 lift
# that makes the fork-side twin publisher buildable (Task 9). Both topics
# below are now real: the extension's C-ABI-seam publisher
# (extension/src/publishers/BenchCloudPublisher.{h,cpp}, gated on
# $CARLA_BENCH_SEAM_CLOUD=1) and the fork's in-core twin
# (LibCarla/source/carla/ros2/ROS2.cpp, gated on $CARLA_BENCH_INCORE_CLOUD=1).
# benchmarks/cells/calibration.sh's CAL-seam branch exports both env vars and
# boots the extension fork editor without Autoware -- see that file's header
# for the launch recipe, which replaces the refusal this comment used to
# describe.
#
# Format: "<topic>|<type>|<kind>", or "<topic>|<type>|<kind>|<arg>" for a kind
# that takes an argument; kind in generic|odometry|pose|tf|published_time
# (benchmarks/observer/src/bench_observer.cpp). out_dir is supplied by run.sh
# as -p out_dir:=/out, not from this file.
/**:
  ros__parameters:
    topics:
      - /bench/seam_cloud|sensor_msgs/msg/PointCloud2|generic
      - /bench/incore_cloud|sensor_msgs/msg/PointCloud2|generic
