# Physics substepping parity values shared between the extension (approach A)
# and the tier4-native fork (approach B) CARLA runners (M4, three-approach
# evaluation P2-P4 plan). Harmonising max_substep_delta_time/max_substeps
# across both runners is what makes the A-vs-B benchmark duel a fair
# comparison -- an uncontrolled physics-substep mismatch would confound the
# load-sweep results with a physics-fidelity difference instead.
#
# Consumed by runner/__main__.py's --substep-config flag (loaded by
# runner/loop.py::load_physics_config, applied via
# runner/loop.py::apply_substep_config to carla.WorldSettings before the run)
# AND, since patch 0003, by the tier4 demo's own --substep-config
# (autoware_demo.py::load_substep_config). Keys match carla.WorldSettings
# verbatim, so ONE file drives both approaches.
#
# SOURCED 2026-07-30 (Task 13) from the tier4 demo's hardcoded literals, in
# ~/src/carla-autoware-native PythonAPI/examples/autoware_demo.py at tier4 sha
# 6315b856f -- i.e. the file BEFORE patch 0003 turned these two into that
# flag's defaults. Every line number below is that pre-patch file's
# (`git show 6315b856f:PythonAPI/examples/autoware_demo.py`), not the patched
# working tree's.
#
#   line 483  settings.max_substep_delta_time = 0.001  # max 1 ms per physics
#                                                      # substep, swap to 0.01
#                                                      # if no need of extreme
#                                                      # physics realism
#   line 484  settings.max_substeps = 10
max_substep_delta_time: 0.001 # seconds; WorldSettings.max_substep_delta_time
max_substeps: 10 # count; carla.WorldSettings.max_substeps
#
# WHAT THESE TWO NUMBERS DO NOT SETTLE, stated because copying them to the A
# side without it reads as a parity that does not hold. The demo does not
# apply them unconditionally:
#
#   line 480-481  if is_pure_step_execution_enabled(): substepping = False
#   line 483-485  elif synchronous_mode: <the pair above>, then
#                 settings.substepping = fixed_delta_seconds <=
#                                        max_substep_delta_time * max_substeps
#   line 421      is_pure_step_execution_enabled() == synchronous AND hz_rate
#                                                     set AND NOT --substepping
#
# So at the harmonised 20 Hz world tick (fixed_delta 0.05) the demo ends with
# `substepping = False` on BOTH branches: without --substepping the first
# branch disables it outright, and with --substepping the CARLA condition on
# line 485 evaluates 0.05 <= 0.001 * 10 == 0.01 -> False. The pair above is
# therefore the demo's declared substep BUDGET, and at 20 Hz it is a budget
# that switches substepping off rather than one that shapes it. Both facts are
# properties of the committed demo, checkable at the line numbers above.
#
# CONSEQUENCE FOR THE DUEL, recorded rather than silently absorbed:
# cells/extension.sh passes no --substep-config today, so cell A runs with
# CARLA's own WorldSettings substepping defaults (substepping enabled) while
# cell B runs with substepping disabled by the demo's line 481. Feeding this
# file to runner/__main__.py --substep-config does NOT close that gap by
# itself either: apply_substep_config sets only these two keys and leaves
# `substepping` untouched (runner/loop.py's own docstring says so), so A would
# keep substepping ON with a 0.01 s budget below its own 0.05 s tick. Closing
# it needs a `substepping` switch on the A side, which is Task 12/26's
# surface, not this file's. Registered as a confound in benchmarks/README.md
# ("Physics substepping") so Task 22 carries it rather than rediscovering it.
#
