# closed-loop only, fixed_delta 0.01 -- a high-frequency sensitivity
# variant of cell A).
#
# fixed_delta is a runner/CARLA launch parameter (Task 12, not yet
# written), not a different tree or binary -- process identities are
# unchanged from cell A. See A.yaml for the full grounding notes.
processes:
  - label: carla-server
    pattern: carla-autoware-integration/Unreal/CarlaUnreal/CarlaUnreal.uproject
