# M3 process map for cell CAL-seam (calibration approach, CARLA
# 0.10-fork, Town10HD_Opt, static arm only; cells.yaml, mandatory).
#
# REPLACED 2026-08-03 (Task 8 of the P4 transport-sweep plan; this
# supersedes an earlier draft written for a prior planning cycle's own
# "Task 8", which struck this file at `carla-server` + `observer` only,
# with no `runner` entry, because CAL-seam's launcher refused to boot
# anything at all). CAL-seam is reinstated (P4 spec decision 6, on the D8
# lift that makes the fork-side twin publisher buildable -- Task 9) and
# now derives from processes/A.yaml the same way that file's own header
# derives it: every UE5-tree cell in this evaluation runs the shared
# engine's UnrealEditor in -game mode (manifest placement.run_mode =
# "editor-game", tests/benchmarks/test_manifest.py), never a packaged
# build.
#
# Dropped relative to A.yaml: `injector` (INJECTOR_ENABLED="0" in
# cells/calibration.sh's CAL-seam branch -- CAL-seam is a
# transport/serialization calibration, not a drive, so the clear-road
# injector never runs) and `autoware` (AW_CONTAINER="" -- no Autoware
# stack is brought up; `cells/calibration.sh`'s CAL-seam branch boots
# scripts/e2e/run_e2e.sh with WITH_AUTOWARE=0). Kept: `runner`, because
# run_e2e.sh's spawn+tick runner is what ticks the world CAL-seam's two
# bench publishers publish from (ext_on_tick,
# extension/src/ExtensionInit.cpp) regardless of WITH_AUTOWARE; and
# `observer`, per this repo's convention that every launched cell's CPU
# sampler tracks the observer that records it.
processes:
  # UnrealEditor -game, extension fork tree (pins.yaml
  # extension_carla_fork.path = ~/src/carla-autoware-integration).
  # run_e2e.sh's exact invocation is:
  #   "$CARLA_UNREAL_ENGINE_PATH/.../UnrealEditor" \
  #     "$CARLA_ROOT/Unreal/CarlaUnreal/CarlaUnreal.uproject" "$MAP" -game ...
  # The tree-path segment disambiguates from the tier4-native fork
  # (~/src/carla-autoware-native), which uses the identical uproject
  # filename in a sibling tree (see B.yaml).
  - label: carla-server
    pattern: carla-autoware-integration/Unreal/CarlaUnreal/CarlaUnreal.uproject
  # Host-side spawn+tick runner (repo-root runner/__main__.py), invoked
  # by run_e2e.sh's final line as `python3 -m runner --host ...`,
  # unconditionally regardless of WITH_AUTOWARE.
  - { label: runner, pattern: python3 -m runner }
  # bench_observer recorder (Task 5), started by benchmarks/run.sh step 6
  # for every cell identically (OBSERVER_CONTAINER=bench-observer); stopped
  # by the same name in benchmarks/scripts/teardown.sh.
  - { label: observer, container: bench-observer }
