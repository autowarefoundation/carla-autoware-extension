# M3 process map for cell CAL-rmw (calibration approach, carla: none,
# static arm only; cells.yaml, mandatory).
#
# RE-GROUNDED in Task 8, which wrote the launchers this file previously had
# no way to name. Both container names below are now created by committed
# code, not inferred:
#
#   bench-pub       benchmarks/cells/calibration.sh:
#                     docker run -d --name "$PUB_CONTAINER" ...
#                   with PUB_CONTAINER=bench-pub. It runs bench_pub out of
#                   the SAME image as the observer
#                   (benchmarks/docker/bench-observer.Dockerfile builds both
#                   binaries), so there is no second image to track.
#   bench-observer  benchmarks/run.sh step 6:
#                     docker run -d --name "$OBSERVER_CONTAINER" ...
#                   with OBSERVER_CONTAINER=bench-observer.
#
# The RMW/SHM variant is selected per run by run.sh's --rmw/--shm flags,
# which set RMW_IMPLEMENTATION (and mount the DDS profile whose sha256 the
# manifest records) on BOTH containers. That is a per-run environment
# difference, not a different process, so this file does not change between
# variants.
#
# No host-side entry: everything in this cell runs in a container, and no
# simulator runs at all.
processes:
  - { label: bench-pub, container: bench-pub }
  - { label: observer, container: bench-observer }
