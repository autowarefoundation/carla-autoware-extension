# Workload matrix (spec: Benchmark design). A sweep point is a cell and
# inherits n >= 3 (>= 5 at the ceiling class); primary duel n >= 10.
#
# Each cell's `metrics:` block is the machine-readable binding every analysis
# tool must read instead of hardcoding a topic, a process label or a rate
# (definitions: benchmarks/README.md, "Primary-duel metric definitions").
# Reached with benchmarks.scripts.cell_info.metrics_for(doc, <cell-id>).
#
#   lidar_topic                     the cell's as-emitted pointcloud topic --
#                                   the M2/M4 primary topic and the topic
#                                   one_hop_wall_ms / achieved_rate_ratio /
#                                   lidar_to_ndt_sim_ms are computed on.
#   ndt_topic                       NDT pose output (lidar_to_ndt_sim_ms).
#   control_topic                   the GATED control command (M5/M1b).
#   control_published_time_topic    the PublishedTime companion of
#                                   control_topic; the KEY of the
#                                   published_time.csv rows control_staleness_ms
#                                   reads, which is the PublishedTime topic
#                                   name, NOT control_topic itself.
#   cpu_process_label               the resources.csv `process` value
#                                   carla_process_cpu_pct reads; always a
#                                   `label` registered in
#                                   config/processes/<cell>.yaml.
#   tick_hz                         paced WORLD-TICK target,
#                                   1/fixed_delta_seconds.
#   lidar_expected_hz               SENSOR publish target, the denominator of
#                                   achieved_rate_ratio and the only correct
#                                   basis for an expected message COUNT.
#   ndt_expected_hz                 NDT pose-output target, the denominator of
#                                   the M5 gate's "NDT rate >= 90% of expected"
#                                   criterion (analysis/quality.py) and the
#                                   `expected_ndt_hz` key of quality.json.
#   ladder_branch                   which branch of the pre-registered G1
#                                   localization ladder applies to this cell:
#                                   `absolute` or `relative`. quality.json's
#                                   `ladder_branch` key is written from here.
#   abs_pose_gate_m                 the absolute branch's max-pose_error
#                                   threshold in metres (evaluate_quality's
#                                   `abs_pose_gate_m`). Non-null iff
#                                   ladder_branch is `absolute`.
#
# The two ladder keys are ONE binding in two fields, and they are two fields
# rather than one on purpose. `evaluate_quality(abs_pose_gate_m=None)` means
# "apply the RELATIVE branch", so a single nullable threshold could not
# distinguish "the relative branch was selected" from "nothing has selected a
# branch yet" -- and defaulting an unselected cell into the relative branch
# would silently report an UNGATED cell as gated, the worst outcome available
# to this gate. So `ladder_branch` carries the selection and `abs_pose_gate_m`
# carries only the absolute branch's number, giving three states the M5 gate
# step discriminates mechanically:
#
#   ladder_branch: absolute  + abs_pose_gate_m: <float>  -> absolute branch
#   ladder_branch: relative  + abs_pose_gate_m: null     -> relative branch
#   ladder_branch: null                                  -> REFUSE to gate
#
# Any other combination (absolute with a null threshold, relative with a
# non-null one, an unrecognised branch name) is an inconsistent registration
# and is refused by name, not repaired.
#
# WHICH branch a cell gets is a property of THE MAP BUNDLE THAT CELL
# LOCALIZED AGAINST, not of whether a registration fix landed somewhere in
# the campaign (benchmarks/README.md, "M5 definitions", and the 2026-07-28
# amendment that keyed it on the bundle). That is why this is a per-cell
# binding and not one campaign-wide constant: gating cell E at 0.5 m against
# the deliberately unshifted bundle cells/python-bridge.sh pins would fail it
# by ~0.475 m of map registration, under a reason a reader would attribute to
# the bridge.
#
# tick_hz, lidar_expected_hz and ndt_expected_hz are DIFFERENT numbers that
# happen to coincide at 20.0 on the extension cells; tick_hz diverges on the
# high-frequency cells. Never substitute one for the other. ndt_expected_hz
# tracks the SENSOR rate rather than the tick rate, and is registered
# separately so a cell whose chain decimates cannot be missed.
#
# A `null` binding is NOT a default to fill in at analysis time: it means the
# value is not pre-registered yet, so the metric is UNAVAILABLE for that cell
# and a tool must say so rather than invent one. The task that owes each null
# is named beside it. The bar for a NON-null value is that committed evidence
# in THIS repo fixes it (a constant in committed code, or a live measurement
# recorded in a committed document); an out-of-repo script's literal is not
# enough, whichever direction it would move the number.
cells:
  - id: A
    approach: extension
    carla: 0.10-fork
    map: Town10HD_Opt
    mandatory: true
    arms: [static, closed-loop]
    metrics:
      lidar_topic: /sensing/lidar/top/pointcloud_raw_ex
      ndt_topic: /localization/pose_estimator/pose_with_covariance
      control_topic: /control/command/control_cmd
      control_published_time_topic: # Tasks 13/20, after live discovery
      cpu_process_label: carla-server
      tick_hz: 20.0 # runner/loop.py DEFAULT_FIXED_DELTA = 0.05
      # runner/spawn.py _SENSOR_TICK = "0.05" on the top LiDAR, and the
      # effective sensor rate is min(1/sensor_tick, tick_hz) -- the relation
      # P1 Verdict 4 measured live. A sweep class changes channels/points,
      # never sensor_tick, so this is a per-cell and not a per-class value.
      lidar_expected_hz: 20.0
      # MEASURED, not inferred: docs/e2e-report.md's live re-run records this
      # rig localizing at "NDT ~20 Hz (400 samples)" with the ekf-fused
      # kinematic_state at 19.97 Hz and the sensing chain feeding it alive at
      # ~20 Hz. That gate ran on the Nishi-Shinjuku map (cell C); the rate is a
      # property of the rig and tick, not of the map, so cell A inherits it --
      # the same reasoning lidar_expected_hz already uses across A/C. (The
      # mechanism -- one NDT pose per input cloud, rate-preserving chain --
      # explains the number but is an assertion about Autoware, not evidence
      # from this repo, so it is not what this binding rests on.)
      ndt_expected_hz: 20.0
      ladder_branch: # Task 11 (live G1 re-gate on the shifted Town10 bundle)
      abs_pose_gate_m: # non-null iff ladder_branch is absolute (README: 0.5)
  - id: B
    approach: tier4-native
    carla: 0.10-tier4
    map: Town10HD_Opt
    mandatory: true
    arms: [static, closed-loop]
    metrics:
      lidar_topic: /sensing/lidar/top/pointcloud_raw_ex
      ndt_topic: /localization/pose_estimator/pose_with_covariance
      control_topic: /control/command/control_cmd
      control_published_time_topic: # Tasks 13/20
      cpu_process_label: carla-server
      # NOT REGISTERED (all three): Task 13 (tier4 demo harmonization patch)
      # fixes the tier4 rig's world tick AND its sensor_tick, and BOTH come
      # from the same out-of-repo demo script -- nothing committed here sets
      # either (cells/tier4-native.sh passes no rate at all). An earlier
      # revision registered tick_hz: 20.0 from the demo's `--hz_rate 20` while
      # nulling lidar_expected_hz for being un-sourced: the same evidence,
      # two different standards. physics.yaml's precedent settles it -- values
      # are SOURCED from the demo by Task 13, not transcribed from a report --
      # so all three are Task 13's to register, in one commit, before any
      # B-family P3 run. P1 measured the unpatched demo at sensor_tick=0.1
      # (10 Hz) against the extension's 0.05 (20 Hz), so harmonization is a
      # real open choice, not a transcription.
      tick_hz:
      lidar_expected_hz:
      ndt_expected_hz:
      ladder_branch: # Task 11, for whichever bundle Task 13 wires this cell
      abs_pose_gate_m: # non-null iff ladder_branch is absolute (README: 0.5)
  - id: C
    approach: extension
    carla: 0.10-fork
    map: NishishinjukuMap
    mandatory: true
    arms: [static, closed-loop]
    metrics:
      lidar_topic: /sensing/lidar/top/pointcloud_raw_ex
      ndt_topic: /localization/pose_estimator/pose_with_covariance
      control_topic: /control/command/control_cmd
      control_published_time_topic: # Tasks 13/20
      cpu_process_label: carla-server
      tick_hz: 20.0
      lidar_expected_hz: 20.0 # same rig as cell A; only the map differs
      # docs/e2e-report.md's ~20 Hz NDT measurement is from the Nishi-Shinjuku
      # e2e gate, i.e. THIS cell's map, and cell A inherits it as the same rig.
      ndt_expected_hz: 20.0
      ladder_branch: # NOT Task 11's: that re-gate is Town10; this cell's Nishi bundle is unselected
      abs_pose_gate_m: # non-null iff ladder_branch is absolute (README: 0.5)
  - id: D
    approach: tier4-native
    carla: 0.10-tier4
    map: NishishinjukuMap
    mandatory: false
    arms: [static, closed-loop] # only if the map cooks in the tier4 tree
    metrics:
      lidar_topic: /sensing/lidar/top/pointcloud_raw_ex
      ndt_topic: /localization/pose_estimator/pose_with_covariance
      control_topic: /control/command/control_cmd
      control_published_time_topic: # Tasks 13/20
      cpu_process_label: carla-server
      tick_hz: # Task 13, as cell B
      lidar_expected_hz: # Task 13, as cell B
      ndt_expected_hz: # Task 13, as cell B
      ladder_branch: # unselected: the Nishi bundle, plus Task 13's map wiring
      abs_pose_gate_m: # non-null iff ladder_branch is absolute (README: 0.5)
  - id: E
    approach: python-bridge
    carla: 0.9.15
    map: Town10HD_Opt
    mandatory: true
    arms: [static, closed-loop]
    metrics:
      # AMENDED 2026-07-29 (Task 10). Cell E runs the PATCHED bridge image, and
      # 0002-sensor-config-harmonized.patch sets the bridge's `topic_suffix` to
      # /pointcloud_raw_ex -- the spec's injection topic in every cell -- so
      # this is now where E emits. The patch has to move
      # carla_sensor_kit_launch's crop_box_filter_self input with it (that
      # launch file HARDCODES the old name), or the chain would be severed.
      # Cell E0, on the unpatched image, still emits /pointcloud_before_sync
      # and keeps that binding: the two are deliberately different.
      lidar_topic: /sensing/lidar/top/pointcloud_raw_ex
      ndt_topic: /localization/pose_estimator/pose_with_covariance
      control_topic: /control/command/control_cmd
      control_published_time_topic: # Tasks 13/20
      cpu_process_label: carla-server
      # patches/python-bridge/README.md: the bridge drives CARLA in
      # synchronous mode with fixed_delta_seconds = 0.05, verified live.
      tick_hz: 20.0
      # NOT REGISTERED: the bridge's own sensor rig, re-grounded live by
      # Task 10/20 before any E-family P3 run. P1 measured 8.59 Hz as-emitted
      # on an unpatched run, which is a MEASUREMENT, not a target.
      lidar_expected_hz:
      ndt_expected_hz: # Task 10/20, with lidar_expected_hz
      ladder_branch: # cell E's re-gate: which pcd variant E localizes against is MEASURED first
      abs_pose_gate_m: # non-null iff ladder_branch is absolute (README: 0.5)
  - id: E0
    approach: python-bridge
    carla: 0.9.15
    map: Town10HD_Opt
    mandatory: true
    # Amended 2026-07-28 (P1 Verdict 1): the as-shipped bridge cannot close
    # the loop (is_dense rejection + sync-tick stall, both source-level).
    # E0 measures the as-shipped configuration to its failure point: raw-topic
    # transport + process cost, static arm only. The closed loop is cell E's
    # (patched, see patches/python-bridge/0001) and the failure itself is E0's
    # reported result.
    arms: [static]
    metrics:
      # STAYS /pointcloud_before_sync: this cell runs the UNPATCHED image, so
      # the bridge's shipped `topic_suffix` applies. E/E-opt were amended to
      # /pointcloud_raw_ex by Task 10's 0002; E0 must not follow, or it would
      # read a topic its own image never publishes on.
      lidar_topic: /sensing/lidar/top/pointcloud_before_sync
      ndt_topic: /localization/pose_estimator/pose_with_covariance
      control_topic: /control/command/control_cmd
      control_published_time_topic: # Tasks 13/20
      cpu_process_label: carla-server
      tick_hz: 20.0
      lidar_expected_hz: # Task 10/20, as cell E
      ndt_expected_hz: # Task 10/20, as cell E
      ladder_branch: # cell E's re-gate: which pcd variant E localizes against is MEASURED first
      abs_pose_gate_m: # non-null iff ladder_branch is absolute (README: 0.5)
  - id: E-opt
    approach: python-bridge
    carla: 0.9.15
    map: Town10HD_Opt
    mandatory: false
    arms: [closed-loop] # local packer-optimized sensitivity
    metrics:
      # AMENDED 2026-07-29 (Task 10), as cell E: E-opt runs the same patched
      # image, so 0002's /pointcloud_raw_ex applies here too.
      lidar_topic: /sensing/lidar/top/pointcloud_raw_ex
      ndt_topic: /localization/pose_estimator/pose_with_covariance
      control_topic: /control/command/control_cmd
      control_published_time_topic: # Tasks 13/20
      cpu_process_label: carla-server
      tick_hz: 20.0
      lidar_expected_hz: # Task 10/20, as cell E
      ndt_expected_hz: # Task 10/20, as cell E
      ladder_branch: # cell E's re-gate: which pcd variant E localizes against is MEASURED first
      abs_pose_gate_m: # non-null iff ladder_branch is absolute (README: 0.5)
  - id: CAL-rmw
    approach: calibration
    carla: none
    map: none
    mandatory: true
    arms: [static]
    metrics:
      # bench_pub's synthetic PointCloud2; cells/calibration.sh passes the
      # same default bench_pub.cpp declares.
      lidar_topic: /bench/cloud
      # No Autoware in this cell, so none of the stack-side topics exist and
      # none is coming (observer_topics/CAL-rmw.yaml says the same).
      ndt_topic:
      control_topic:
      control_published_time_topic:
      # No simulator process: processes/CAL-rmw.yaml registers bench-pub and
      # the observer only, so there is no CARLA CPU series to compare.
      cpu_process_label:
      tick_hz: # no simulator, no world tick, no /clock
      # cells/calibration.sh's PUB_RATE_HZ DEFAULT. That script also honours a
      # BENCH_PUB_RATE_HZ override, so a run that sets it invalidates this
      # binding: the override must be registered here (before P3) rather than
      # left to diverge, or achieved_rate_ratio silently divides by 10.0 on a
      # cell that published at something else.
      lidar_expected_hz: 10.0
      ndt_expected_hz: # no localization stack in this cell
      ladder_branch: # no localization stack in this cell
      abs_pose_gate_m: # non-null iff ladder_branch is absolute (README: 0.5)
  - id: CAL-seam
    approach: calibration
    carla: 0.10-fork
    map: Town10HD_Opt
    mandatory: true
    arms: [static]
    metrics:
      # NOT REGISTERED: the seam/in-core publisher pair is Task 14 and names
      # no topic yet; observer_topics/CAL-seam.yaml is deliberately empty for
      # the same reason, and cells/calibration.sh refuses to launch the cell.
      lidar_topic:
      ndt_topic:
      control_topic:
      control_published_time_topic:
      cpu_process_label: carla-server
      # NOT REGISTERED either: Task 14 owns what ticks this cell's world, if
      # anything does -- it is a transport/serialization calibration, not a
      # drive, and cells/calibration.sh refuses to launch it today. Registering
      # the extension cells' 20.0 here would assert a tick nothing commits to.
      tick_hz:
      lidar_expected_hz: # Task 14
      ndt_expected_hz: # no localization stack in this cell
      ladder_branch: # no localization stack in this cell
      abs_pose_gate_m: # non-null iff ladder_branch is absolute (README: 0.5)
  - id: A-hf
    approach: extension
    carla: 0.10-fork
    map: Town10HD_Opt
    mandatory: false
    arms: [closed-loop] # fixed_delta 0.01
    metrics:
      lidar_topic: /sensing/lidar/top/pointcloud_raw_ex
      ndt_topic: /localization/pose_estimator/pose_with_covariance
      control_topic: /control/command/control_cmd
      control_published_time_topic: # Tasks 13/20
      cpu_process_label: carla-server
      # ALL THREE NOT REGISTERED: owed by TASK 26 ("Optional cells -- E-opt,
      # A-hf/B-hf", owner-strikable), whose Step 2 is this cell's whole
      # configuration. If the owner strikes Task 26 the cell is dropped and
      # these stay null permanently -- a legitimate end state, not a gap.
      #
      # tick_hz: an earlier revision registered 100.0, reasoning that the
      # MECHANISM is committed -- runner/__main__.py's --fixed-delta, Task 12,
      # landed -- unlike B-hf, where no launcher exists at all. But a committed
      # mechanism nothing invokes is not a setting: cells/extension.sh passes
      # no fixed-delta argument, so an A-hf run today ticks at the runner's
      # 0.05 default while the binding claimed 100.0 -- a registered number no
      # run is obliged to honour and nothing checks, which is the
      # silent-wrong-number class this campaign exists to avoid.
      #
      # lidar_expected_hz/ndt_expected_hz: an earlier revision registered 20.0
      # for both, reasoning that --fixed-delta moves the world tick and not the
      # rig's sensor_tick, so A-hf inherits cell A's 0.05. THAT REASONING DOES
      # NOT HOLD FOR THIS CELL: Task 26 Step 2 configures A-hf's LiDAR
      # sensor_tick EXPLICITLY and separately from the tick, to a value that is
      # neither cell A's 0.05 nor the tick period -- so the sensor rate is not
      # cell A's and cannot be derived from the tick rate even once the tick is
      # known. Task 26 registers all three from what it actually applies, and
      # must state the sensor_tick it used. Its own stated point is per-run
      # rate verification, which is exactly the check an earlier revision of
      # this comment asked for without knowing whose it was.
      #
      # CONFIRM THE INTENDED SENSOR_TICK BEFORE APPLYING IT. Task 26 Step 2
      # writes A-hf's LiDAR sensor_tick as 0.1 -- 10 Hz, which is HALF cell
      # A's 20 Hz, on a cell whose entire purpose is HIGHER frequency, and
      # alongside an IMU at 0.01 on the same line. 0.1 is also exactly the
      # TIER4 demo's unpatched baseline (see cell B above: "P1 measured the
      # unpatched demo at sensor_tick=0.1 (10 Hz) against the extension's
      # 0.05"), so a tier4-side figure may have been carried into the
      # extension-side line. This records the question; it does NOT answer it.
      # 0.1 and 0.01 are both coherent readings and nothing in this repo
      # discriminates between them, so registering either would be a guess
      # presented as a fact -- unlike control_staleness_ms's clock-domain
      # branches, which a run's own data decides. Raised with the plan owner.
      #
      # `arms: [closed-loop] # fixed_delta 0.01` above still records the cell's
      # INTENT; these keys record what a run will actually do, and today
      # nothing does any of it.
      tick_hz:
      lidar_expected_hz:
      ndt_expected_hz:
      ladder_branch: # Task 11 (live G1 re-gate on the shifted Town10 bundle)
      abs_pose_gate_m: # non-null iff ladder_branch is absolute (README: 0.5)
  - id: B-hf
    approach: tier4-native
    carla: 0.10-tier4
    map: Town10HD_Opt
    mandatory: false
    arms: [closed-loop]
    metrics:
      lidar_topic: /sensing/lidar/top/pointcloud_raw_ex
      ndt_topic: /localization/pose_estimator/pose_with_covariance
      control_topic: /control/command/control_cmd
      control_published_time_topic: # Tasks 13/20
      cpu_process_label: carla-server
      # NOT REGISTERED: this cell's INTENT is the A-hf counterpart, but the
      # launch argument that would apply it is Task 13's and does not exist
      # (processes/B-hf.yaml says so). 100.0 here would be an intent, not a
      # setting -- same standard as cell B above. Task 26 Step 2 owns this
      # cell's configuration (`--hz_rate 100` plus tier4 patch-0003 sensor
      # ticks "to match"), on top of Task 13's launcher; like A-hf, the sensor
      # ticks are set explicitly there, so none of the three can be derived
      # from the tick rate. Task 26 registers all three from what it applies.
      tick_hz:
      lidar_expected_hz:
      ndt_expected_hz:
      ladder_branch: # Task 11, for whichever bundle Task 13 wires this cell
      abs_pose_gate_m: # non-null iff ladder_branch is absolute (README: 0.5)
  - id: B45
    approach: tier4-native
    carla: 0.10-tier4
    map: Town10HD_Opt
    mandatory: true
    arms: [closed-loop] # Autoware 0.45.x image
    metrics:
      lidar_topic: /sensing/lidar/top/pointcloud_raw_ex
      ndt_topic: /localization/pose_estimator/pose_with_covariance
      control_topic: /control/command/control_cmd
      control_published_time_topic: # Tasks 13/20
      cpu_process_label: carla-server
      tick_hz: # Task 13, as cell B (identical CARLA-side recipe)
      lidar_expected_hz: # Task 13, as cell B
      ndt_expected_hz: # Task 13, as cell B
      ladder_branch: # Task 11, for whichever bundle Task 13 wires this cell
      abs_pose_gate_m: # non-null iff ladder_branch is absolute (README: 0.5)
sweep_classes:
  - { id: vlp16, channels: 16, points_per_second: 288000, applies_to: [A, B, E] }
  - { id: 32ch, channels: 32, points_per_second: 1200000, applies_to: [A, B, E] }
  - { id: 128ch, channels: 128, points_per_second: 4600000, applies_to: [A, B, E] }
sweep_arms: [paced, unpaced, ablation] # ablation = publish-disabled baseline
# M4 camera-load arm (spec: M4): each approach's native camera path, observer
# as the only consumer, topic names as-emitted. 20 fps == the 20 Hz tick
# ceiling (P1 Verdict 4: a higher request would be silently clamped).
camera_classes:
  - { id: cam1, cameras: 1, width: 1600, height: 900, fps: 20, applies_to: [A, B, E] }
  - { id: cam3, cameras: 3, width: 1600, height: 900, fps: 20, applies_to: [A, B, E] }
  - { id: cam6, cameras: 6, width: 1600, height: 900, fps: 20, applies_to: [A, B, E] }
