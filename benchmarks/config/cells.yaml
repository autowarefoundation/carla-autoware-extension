# Workload matrix (spec: Benchmark design). A sweep point is a cell and
# inherits n >= 3 (>= 5 at the ceiling class); primary duel n >= 10.
#
# Each cell's `metrics:` block is the machine-readable binding every analysis
# tool must read instead of hardcoding a topic, a process label or a rate
# (definitions: benchmarks/README.md, "Primary-duel metric definitions").
# Reached with benchmarks.scripts.cell_info.metrics_for(doc, <cell-id>).
#
#   lidar_topic                     the cell's as-emitted pointcloud topic --
#                                   the M2/M4 primary topic and the topic
#                                   one_hop_wall_ms / achieved_rate_ratio /
#                                   lidar_to_ndt_sim_ms are computed on.
#   ndt_topic                       NDT pose output (lidar_to_ndt_sim_ms).
#   control_topic                   the GATED control command (M5/M1b).
#   control_published_time_topic    the PublishedTime companion of
#                                   control_topic; the KEY of the
#                                   published_time.csv rows control_staleness_ms
#                                   reads, which is the PublishedTime topic
#                                   name, NOT control_topic itself.
#   cpu_process_label               the resources.csv `process` value
#                                   carla_process_cpu_pct reads; always a
#                                   `label` registered in
#                                   config/processes/<cell>.yaml.
#   tick_hz                         paced WORLD-TICK target,
#                                   1/fixed_delta_seconds.
#   lidar_expected_hz               SENSOR publish target, the denominator of
#                                   achieved_rate_ratio and the only correct
#                                   basis for an expected message COUNT.
#   ndt_expected_hz                 NDT pose-output target, the denominator of
#                                   the M5 gate's "NDT rate >= 90% of expected"
#                                   criterion (analysis/quality.py) and the
#                                   `expected_ndt_hz` key of quality.json.
#   ladder_branch                   which branch of the pre-registered G1
#                                   localization ladder applies to this cell:
#                                   `absolute` or `relative`. quality.json's
#                                   `ladder_branch` key is written from here.
#   abs_pose_gate_m                 the absolute branch's max-pose_error
#                                   threshold in metres (evaluate_quality's
#                                   `abs_pose_gate_m`). Non-null iff
#                                   ladder_branch is `absolute`.
#
# The two ladder keys are ONE binding in two fields, and they are two fields
# rather than one on purpose. `evaluate_quality(abs_pose_gate_m=None)` means
# "apply the RELATIVE branch", so a single nullable threshold could not
# distinguish "the relative branch was selected" from "nothing has selected a
# branch yet" -- and defaulting an unselected cell into the relative branch
# would silently report an UNGATED cell as gated, the worst outcome available
# to this gate. So `ladder_branch` carries the selection and `abs_pose_gate_m`
# carries only the absolute branch's number, giving three states the M5 gate
# step discriminates mechanically:
#
#   ladder_branch: absolute  + abs_pose_gate_m: <float>  -> absolute branch
#   ladder_branch: relative  + abs_pose_gate_m: null     -> relative branch
#   ladder_branch: null                                  -> REFUSE to gate
#
# Any other combination (absolute with a null threshold, relative with a
# non-null one, an unrecognised branch name) is an inconsistent registration
# and is refused by name, not repaired.
#
# WHICH branch a cell gets is a property of THE MAP BUNDLE THAT CELL
# LOCALIZED AGAINST, not of whether a registration fix landed somewhere in
# the campaign (benchmarks/README.md, "M5 definitions", and the 2026-07-28
# amendment that keyed it on the bundle). That is why this is a per-cell
# binding and not one campaign-wide constant: gating cell E at 0.5 m against
# the deliberately unshifted bundle cells/python-bridge.sh pins would fail it
# by ~0.475 m of map registration, under a reason a reader would attribute to
# the bridge.
#
# tick_hz, lidar_expected_hz and ndt_expected_hz are DIFFERENT numbers that
# happen to coincide at 20.0 on the extension cells; tick_hz diverges on the
# high-frequency cells. Never substitute one for the other. ndt_expected_hz
# tracks the SENSOR rate rather than the tick rate, and is registered
# separately so a cell whose chain decimates cannot be missed.
#
# A `null` binding is NOT a default to fill in at analysis time: it means the
# value is not pre-registered yet, so the metric is UNAVAILABLE for that cell
# and a tool must say so rather than invent one. The task that owes each null
# is named beside it. The bar for a NON-null value is that committed evidence
# in THIS repo fixes it (a constant in committed code, or a live measurement
# recorded in a committed document); an out-of-repo script's literal is not
# enough, whichever direction it would move the number.
#
# `dropped:` -- SCOPE, NOT FEASIBILITY (added 2026-07-30). A cell carrying
# this key is one the owner's 2026-07-30 core-duel scope cut removed from
# what this campaign will MEASURE. It is deliberately a SEPARATE key rather
# than a flip of `mandatory:`, because the two answer different questions and
# this file needs both answers at once:
#
#   mandatory: true  + no `dropped:`  -> owed; a campaign result rests on it
#   mandatory: true  + `dropped:`     -> WAS owed, struck by the 2026-07-30
#                                        pre-registration amendment
#                                        (CAL-seam, B45). `mandatory: true`
#                                        STAYS, so the record still shows
#                                        what was given up.
#   mandatory: false + `dropped:`     -> pre-registered as owner-strikable
#                                        and now struck (D, E-opt, A-hf,
#                                        B-hf): a note, not a matrix change.
#   mandatory: false + no `dropped:`  -> optional and still in scope
#
# Flipping `mandatory` to false instead would have collapsed rows 2 and 3
# into one value, so the file would read as if CAL-seam and B45 had always
# been optional -- which is false, and is exactly the misstatement this
# amendment exists to avoid. Same shape of argument as `ladder_branch` /
# `abs_pose_gate_m` above: two distinct states one flag cannot carry.
#
# NONE of the dropped cells was technically infeasible, blocked or
# unmeasurable. The reason is an owner TIME-BUDGET decision taken on two
# measurements, stated per item in benchmarks/README.md's
# `## Amendments made so far` (2026-07-30, the core-duel scope cut). B45 in
# particular was expected to surface a hard-fork-maintenance result; the
# campaign is choosing NOT TO LOOK, which is a different statement from "it
# failed" or "it could not be measured".
#
# No consumer reads either key to decide completeness, so neither the strike
# nor this new key can make a tool report a false "all mandatory cells
# measured": `cell_info.merge` copies both into its JSON and `run.sh` reads
# only approach / map / carla / has_sim_clock / arms / sweep_arms from it;
# `analysis/manifest.py` reads `id` alone. tests/benchmarks/test_cell_info.py
# pins the table above instead, so a later silent strike of a MANDATORY cell
# fails a test rather than passing review.
cells:
  - id: A
    approach: extension
    carla: 0.10-fork
    map: Town10HD_Opt
    mandatory: true
    arms: [static, closed-loop]
    metrics:
      lidar_topic: /sensing/lidar/top/pointcloud_raw_ex
      ndt_topic: /localization/pose_estimator/pose_with_covariance
      control_topic: /control/command/control_cmd
      # REGISTERED 2026-08-03 (Task 5, P4 transport-sweep plan), before any P4
      # collection run, closing the gap Tasks 13/20 left open: this cell's own
      # observer_topics/A.yaml has carried the PublishedTime row since
      # 2026-07-30 (Task 15b's live discovery on cell A's own stack, right
      # after arming), but this binding stayed null, which left
      # control_staleness_ms UNAVAILABLE for the whole P3 duel
      # (docs/evaluation/p3-baseline.md Sec.1, and duel_verdict.build_verdict_
      # table's "unavailable if either side is unbound" rule -- see A.yaml's
      # own "STILL OWED" note this closes). SAME AUTOWARE GRAPH FAMILY AS
      # CELL B: both approaches gate through vehicle_cmd_gate and the same
      # PublishedTimePublisher implementation stamps the gated
      # /control/command/control_cmd on both, so the topic name and type
      # (autoware_internal_msgs/msg/PublishedTime) are identical to B's
      # registration -- not a merge of the two cells, a property of the
      # shared Autoware stack. NOT yet live-confirmed through THIS binding:
      # that check is owed to Task 11's bring-up boot (`ros2 topic list |
      # grep published_time` against a live cell-A run), which must observe
      # this exact topic before any P4 duel run proceeds.
      control_published_time_topic: /control/command/control_cmd/debug/published_time
      cpu_process_label: carla-server
      tick_hz: 20.0 # runner/loop.py DEFAULT_FIXED_DELTA = 0.05
      # runner/spawn.py _SENSOR_TICK = "0.05" on the top LiDAR, and the
      # effective sensor rate is min(1/sensor_tick, tick_hz) -- the relation
      # P1 Verdict 4 measured live. A sweep class changes channels/points,
      # never sensor_tick, so this is a per-cell and not a per-class value.
      lidar_expected_hz: 20.0
      # MEASURED, not inferred: docs/e2e-report.md's live re-run records this
      # rig localizing at "NDT ~20 Hz (400 samples)" with the ekf-fused
      # kinematic_state at 19.97 Hz and the sensing chain feeding it alive at
      # ~20 Hz. That gate ran on the Nishi-Shinjuku map (cell C); the rate is a
      # property of the rig and tick, not of the map, so cell A inherits it --
      # the same reasoning lidar_expected_hz already uses across A/C. (The
      # mechanism -- one NDT pose per input cloud, rate-preserving chain --
      # explains the number but is an assertion about Autoware, not evidence
      # from this repo, so it is not what this binding rests on.)
      ndt_expected_hz: 20.0
      # SELECTED by Task 11's live G1 re-gate (2026-07-29). This cell
      # localizes against the ladder's RUNG-2 bundle (pins.yaml
      # town10_pcd_regen, via map_defaults.sh), which IS registered to the
      # world it runs in, so branch (a) applies. MEASURED on that bundle: max
      # NDT error 0.089 m over 400 static samples -- 411 mm inside the 0.5 m
      # gate, bias (dx, dy) = (+0.021, -0.038) m, per-axis jitter std 0.019 /
      # 0.013 m. Raw NDT + ground-truth series and the bundle's own sha256 are
      # TRACKED under benchmarks/evidence/g1-rung2-regen/, so the number that
      # selects this threshold is recomputable from the repo rather than merely
      # asserted. (It previously cited the .gitignore'd reports/ path, where it
      # existed on one workstation only and no fresh clone would have it.)
      #
      # The ladder was walked in order; the earlier rungs are kept because
      # they bound what re-registration alone can do:
      #   dy = -0.475 (town10_pcd_shifted): max 0.824 m; 0.749 m on a second
      #     window.
      #   dy = -0.607 (town10_pcd_refit, rung 1's refit): max 0.570 m.
      # Those three are TRACKED and recomputable too, under
      # benchmarks/evidence/g1-ladder-rigid/ (see its PROVENANCE.md), so the
      # FAIL rungs are checkable and not only the PASS.
      # Both MISSED the absolute gate; all three windows pass the relative
      # criteria. Rung 2 closed it, for a reason no rigid shift reproduces:
      # it rebuilds the cloud from ground-truth-registered sweeps, so it fixes
      # point DENSITY and not merely a frame offset.
      #
      # How close rigid registration got, stated as only what is verified: on
      # the refit window, subtracting the CHEBYSHEV-OPTIMAL 2-D offset (the
      # minimum-enclosing-circle centre -- the offset that actually minimises
      # the max) leaves max 0.5041 m, over the gate by 4 mm, on a statistic
      # whose same-bundle window-to-window spread was 0.075 m (0.824 vs
      # 0.749) -- both derived from the refit series in
      # benchmarks/evidence/g1-ladder-rigid/refit/, so recomputable.
      # Rigid registration therefore came MARGINALLY short; it was
      # never shown to be decisively excluded. Two earlier claims here were
      # wrong and are corrected rather than quietly dropped: a 0.635 m "floor"
      # from centroid subtraction was an UPPER bound (a centroid minimises
      # RMS, not max) and the refit's own 0.570 m came in under it; and the
      # residual was attributed to along-track jitter, which the data does not
      # support -- the dominant jitter axis SWAPPED between windows (dx 0.097 /
      # dy 0.171 on the dy = -0.475 window against dx 0.229 / dy 0.094 on the
      # refit). What IS established: the residual max is within-lock jitter
      # rather than a frame offset, and Town10 carries 0.50 vertical
      # points/m^2 in the 0.8-3.0 m band against Nishi-Shinjuku's 4.25.
      #
      # CONFOUND (README, "Known confounds"): this bundle is built from THIS
      # rig's own sweeps, including at the pose G1 measures, so 0.089 m is
      # optimistic relative to an independently-sourced map and is NOT
      # directly comparable to Nishi-Shinjuku's 0.078 m on cell C.
      # SOURCE of that 0.078 m: docs/e2e-report.md's "Post-refactor regression
      # re-run (2026-07-24)" table, G1 NDT localization row -- max_err =
      # 0.078 m, 400 samples, threshold 0.5 m. Inline-cited because a recorded
      # number must name its source; Task 11 filed this gap for the final
      # review pass, and Task 15 closes it instead since this file freezes at
      # Task 16. The 0.089 m above is tracked at
      # benchmarks/evidence/g1-rung2-regen/.
      # POINTER (2026-07-30, Task 15): cell C's number is now a TRACKED
      # 0.062 m from its own live re-gate on the current engine state
      # (benchmarks/evidence/g1-nishi-bundle/, and cell C's own comment
      # below). The 0.078 m above (cited to e2e-report.md there) stands --
      # both are real static windows on
      # the same Nishi bundle, 16 mm apart on a max statistic -- but 0.062 m
      # is the one cell C's threshold rests on, so read the pair rather than
      # either alone. The non-comparability claim is unaffected: it is about
      # this bundle's provenance, not about which Nishi window is cited.
      ladder_branch: absolute
      abs_pose_gate_m: 0.5
  - id: B
    approach: tier4-native
    carla: 0.10-tier4
    map: Town10HD_Opt
    mandatory: true
    arms: [static, closed-loop]
    metrics:
      lidar_topic: /sensing/lidar/top/pointcloud_raw_ex
      ndt_topic: /localization/pose_estimator/pose_with_covariance
      control_topic: /control/command/control_cmd
      # REGISTERED 2026-07-30 (Task 13) from LIVE discovery on this cell's own
      # stack -- `ros2 topic list --no-daemon | grep published_time` inside the
      # pinned container during results/B/run-002. Type
      # autoware_internal_msgs/msg/PublishedTime (NOT the plan's assumed
      # autoware_internal_debug_msgs). observer_topics/B.yaml lists the other
      # six PublishedTime topics that exist and says why only this one is
      # subscribed; cell A's stays unregistered because its IMAGE differs and
      # Task 20 owes that observation.
      control_published_time_topic: /control/command/control_cmd/debug/published_time
      cpu_process_label: carla-server
      # REGISTERED 2026-07-30 (Task 13), all three SOURCED from the launcher
      # arguments the same commit landed -- benchmarks/cells/tier4_autoware.sh's
      # TIER4_TICK_HZ / TIER4_LIDAR_ROTATION_HZ, which are what a B-family run
      # actually passes to the fork's (patch-0003) autoware_demo.py. They are
      # committed constants in this repo, not transcriptions from a report, and
      # not the demo's own defaults: the demo defaults to --hz_rate 100.
      #
      # tick_hz: `--hz_rate 20` -> fixed_delta_seconds 0.05, harmonized to cell
      # A's runner/loop.py DEFAULT_FIXED_DELTA. The demo's own 100 Hz default
      # would have put a 5x physics-step difference inside every M3 CPU and RTF
      # comparison of the primary duel.
      tick_hz: 20.0
      # lidar_expected_hz: `--lidar-rotation-hz 10.0` -> sensor_tick 0.1, the
      # demo's OWN value, deliberately NOT harmonized to cell A's 20 Hz. The
      # demo derives points_per_second FROM that period ("horizontal_fov /
      # horizontal_resolution / sensor_tick * channels"), so halving the period
      # at a fixed 288000 pts/s halves the angular resolution -- a fidelity
      # change dressed as harmonization -- while doubling pts/s specifies a
      # different sensor than the VLP16 the demo documents. The M4 sweep
      # classes (sweep_classes below, applying to A and B alike) are where the
      # two rigs ARE equalized. CORROBORATED live before this registration:
      # Task 9 measured the same rig at 10.002 Hz CARLA-side (3300 frames) and
      # 10.006/10.070 Hz on the wire, and the stock bench_observer recorded 243
      # rows in 24 s (10.1 Hz) -- benchmarks/patches/tier4-native/README.md.
      lidar_expected_hz: 10.0
      # ndt_expected_hz: the SENSOR rate, not the tick rate (see this file's
      # header) -- one NDT pose per input cloud is the target, so registering
      # 10.0 is the conservative choice: a chain that decimates fails the M5
      # NDT-rate criterion instead of hiding inside a lower expectation. The
      # mechanism (rate-preserving sensing chain) is an assertion about
      # Autoware; what backs the NUMBER is cell B's own closed-loop gate run,
      # whose measured ndt_rate_ratio is recorded with the run
      # (results/B/run-001/quality.json) and in the Task 13 report.
      ndt_expected_hz: 10.0
      # SELECTED 2026-07-30 (Task 13) from THE BUNDLE THIS CELL MOUNTS, which
      # is the pre-registered rule (README, "M5 definitions"): the branch is a
      # property of the bundle, and cells/tier4_autoware.sh resolves its bundle
      # through scripts/e2e/map_defaults.sh -- the SAME table cells A/A-hf read
      # -- so Town10HD_Opt is pins.yaml `town10_pcd_regen`, the ladder's rung-2
      # bundle. The MEASUREMENT backing the absolute branch on that bundle is
      # Task 11's, tracked under benchmarks/evidence/g1-rung2-regen/ (max NDT
      # error 0.089 m over 400 static samples, 411 mm inside the gate); cell A
      # carries its full ladder walk. Cell B's own run confirms it against the
      # same 0.5 m threshold rather than re-deriving it.
      #
      # Task 11 deliberately left this null because the branch DIFFERS BY
      # BUNDLE, not by map -- town10-regen -> absolute 0.5, while
      # town10-shifted / the unshifted ~/autoware_map/town10 -> relative
      # (measured max 0.570 m and 0.824 m) -- so it could not be settled until
      # Task 13 chose one. That choice is now made and it is A's bundle, which
      # is also what keeps README confound C4 a cross-map caveat instead of
      # escalating it to a duel-level confound.
      ladder_branch: absolute
      abs_pose_gate_m: 0.5
  - id: B-cyc
    approach: tier4-native
    carla: 0.10-tier4
    map: Town10HD_Opt
    mandatory: true
    # REGISTERED 2026-08-03 by the P4 transport-sweep plan (Task 4). The SAME
    # tier4-native stack as cell B -- same fork, same launcher
    # (cells/tier4_autoware.sh), same map/bundle -- registered under a
    # DIFFERENT DDS transport: rmw_cyclonedds_cpp, SHM off, NO profile. This
    # is the measured ROW-11 configuration in
    # benchmarks/patches/tier4-native/README.md's transport matrix ("###
    # Transport matrix (live fork, .../pointcloud_raw_ex)"): rows 5 and 10
    # (cyclone + the harness's `lo`-pinned `cyclonedds.xml` profile) see
    # NOTHING from the fork -- no topic-list entry, no echo, no rate -- so
    # that harness default is unusable here. Row 11 (cyclone, NO profile) is
    # the ONLY non-fastrtps configuration in which the fork is readable at
    # all, and its own registered caveats -- it binds the host's ROUTABLE NIC
    # rather than loopback, and Cyclone's discovery graph is FLAKY for
    # bare-DDS publishers (that README's own words: "Do not use them") -- are
    # INHERITED here as confound rows for this cell's results; they are not
    # fixed by this registration. Cell B's own registration
    # (rmw_fastrtps_cpp / SHM off / udp_only.xml) is UNTOUCHED by this entry.
    #
    # END-TO-END PRECEDENT: results/B/run-033 ran exactly this transport
    # triple (manifest.json: transport.rmw=rmw_cyclonedds_cpp,
    # shm_enabled=false, dds_profile_sha256="") as a deliberate one-off
    # deviation probe on cell B (BENCH_TIER4_TRANSPORT_DEVIATION) -- armed,
    # drove the closed-loop arm end to end, and measured ndt_rate_ratio 1.000
    # (n=1, quality.json). B-cyc turns that probe into its OWN registered
    # cell so the row-11 configuration can be duelled against cell A on equal
    # footing: run.sh resolves this transport by DEFAULT for cell B-cyc (the
    # same shape of per-cell correction the tier4-native family block already
    # applies for cell B), and cells/tier4_autoware.sh's registered-transport
    # refusal fails loudly on anything else for this cell.
    arms: [static, closed-loop]
    metrics:
      lidar_topic: /sensing/lidar/top/pointcloud_raw_ex
      ndt_topic: /localization/pose_estimator/pose_with_covariance
      control_topic: /control/command/control_cmd
      # Mirrored from cell B verbatim: same launcher, same live discovery
      # (Task 13, 2026-07-30 -- see cell B's own comment above for the full
      # derivation). observer_topics/B.yaml already carries this row, and
      # observer_topics/B-cyc.yaml is a copy of that file, so it inherits it
      # unchanged.
      control_published_time_topic: /control/command/control_cmd/debug/published_time
      cpu_process_label: carla-server
      # Mirrored from cell B field-for-field: same launcher
      # (cells/tier4_autoware.sh), same TIER4_TICK_HZ / TIER4_LIDAR_ROTATION_HZ
      # arguments -- DDS transport is the ONLY axis this cell varies from B,
      # and none of these three rates is a property of the transport. See
      # cell B's own comment above for the sourcing.
      tick_hz: 20.0
      lidar_expected_hz: 10.0
      ndt_expected_hz: 10.0
      # Mirrored from cell B: same launcher resolves the same
      # map_defaults.sh bundle (town10_pcd_regen, the ladder's rung-2
      # bundle), so the same branch applies. See cell B's own comment above
      # for the measurement this rests on.
      ladder_branch: absolute
      abs_pose_gate_m: 0.5
  - id: C
    approach: extension
    carla: 0.10-fork
    map: NishishinjukuMap
    mandatory: true
    arms: [static, closed-loop]
    metrics:
      lidar_topic: /sensing/lidar/top/pointcloud_raw_ex
      ndt_topic: /localization/pose_estimator/pose_with_covariance
      control_topic: /control/command/control_cmd
      control_published_time_topic: # Tasks 13/20
      cpu_process_label: carla-server
      tick_hz: 20.0
      lidar_expected_hz: 20.0 # same rig as cell A; only the map differs
      # docs/e2e-report.md's ~20 Hz NDT measurement is from the Nishi-Shinjuku
      # e2e gate, i.e. THIS cell's map, and cell A inherits it as the same rig.
      ndt_expected_hz: 20.0
      # SELECTED 2026-07-30 (Task 15) by THIS CELL'S OWN live G1 re-gate on
      # the current engine state -- Task 11's re-gate is Town10 and could not
      # settle this one, because the branch is a property of the BUNDLE (this
      # file's header; README "M5 definitions"). The bundle is the
      # map_defaults.sh NishishinjukuMap entry, container
      # /autoware_map/nishishinjuku, pointcloud_map.pcd sha256
      # 78b6cf81047489efb1f008a44238d497241da64bb158c824a3f18f23eb50e9d3, and
      # it IS registered to the world it runs in, so branch (a) applies.
      #
      # MEASURED on that bundle: max NDT error 0.062 m over 400 static
      # samples in a 19.98 s window -- 438 mm inside the 0.5 m gate -- mean
      # 0.031 m, median 0.030 m, bias (dx, dy) = (-0.004, +0.021) m, per-axis
      # jitter std 0.021 / 0.012 m. The 21 mm bias is the point of contrast
      # with cell A's ladder: there is no map-registration offset here of the
      # kind Town10's rigid bundles carry (+0.475 m cross-track), so no
      # ladder had to be walked -- the first and only rung passed.
      # Raw NDT + ground-truth series, the bundle digest and the boot's
      # engine BuildId / fork SHA / extension .so digest are TRACKED under
      # benchmarks/evidence/g1-nishi-bundle/, so this threshold's selecting
      # number is recomputable from the repo. The same boot's G2 is
      # benchmarks/evidence/g2-nishi-cellc/ (closest approach 0.046 m on the
      # 230.5 m pre-registered route -- config/routes/NishishinjukuMap.yaml's
      # own recorded total length. The retained distance series OPENS at
      # 222.110 m, ~5.2 m after engage, because the gate's control_cmd
      # liveness check runs before collection starts; that PROVENANCE.md
      # keeps the three distances apart.)
      #
      # NOT the historical figure: docs/e2e-report.md records 0.078 m on this
      # map -- its "Post-refactor regression re-run (2026-07-24)" table, G1 NDT
      # localization row (max_err = 0.078 m, 400 samples, threshold 0.5 m); the
      # same table's G2 row is the 0.064 m closest approach. Cell A's comment
      # above cites the same number and location. Both are static
      # windows on this bundle, 16 mm apart on a max statistic; 0.062 m is
      # what the branch rests on because it is measured on the CURRENT engine
      # state and its series are tracked. Cell A's 0.089 m stays NOT directly
      # comparable for the reason stated there (its bundle is rebuilt from
      # that rig's own sweeps; this one is independently sourced).
      ladder_branch: absolute
      abs_pose_gate_m: 0.5
  - id: D
    approach: tier4-native
    carla: 0.10-tier4
    map: NishishinjukuMap
    mandatory: false
    # STRUCK 2026-07-30 by the owner's core-duel scope cut (see `dropped:` in
