      #      `self.timestamp` -- SIM time, and deliberately so ("Uses simulation
      #      time (self.timestamp) for all sensors to ensure correct throttling in
      #      synchronous mode"). `frequency_hz` is sensor_mapping.yaml's
      #      ros_config value.
