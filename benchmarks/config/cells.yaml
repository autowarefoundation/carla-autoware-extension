# BOTH BRANCHES ARE PRE-REGISTERED HERE, because which one applies is decided
# MECHANICALLY BY THE DATA -- the campaign's standing rule, the same one the
# `ladder_branch` / `abs_pose_gate_m` pair above follows, and the reason the
# `-hf` cells' rate bindings stay null rather than guessing. The M4 claim's
# second registered falsifier is "Whether the M4 ceiling criterion actually
# fires at vlp16" (README, "Registered claim (Task 13)"), so:
#
#   ceiling criterion FIRES at vlp16   -> `vlp16` alone is SUFFICIENT. The
#     spec's M4 success criterion is a fired ceiling criterion OR the 128-ch
#     class, and the first disjunct is met, so no step-up is needed and both
#     struck classes stay struck. This is the branch the strike assumes.
#   ceiling criterion DOES NOT FIRE at vlp16 -> the claim is FALSIFIED and the
#     ceiling has not been located, so a STEP-UP class is needed to find where
#     it is. `32ch` is that step-up, pre-registered as such HERE and now.
#     Reinstating it in that case is an ANTICIPATED amendment, not a novel
#     one: the branch and its trigger are registered before any P3 run, so
#     acting on it is not a definition settled after seeing data.
#
# `128ch` stays struck on EITHER branch: once the criterion fires at a lower
# class nothing needs it, and if it does not fire at `vlp16` the informative
# next probe is the adjacent class, not the extreme one.
#
# Recorded as a COMMENT rather than a per-entry `dropped:` field, unlike the
# cells above: `cell_info.merge` copies every non-meta class key into the
# merged cell JSON at TOP level, so a class-level `dropped:` would read there
# as if the CELL were dropped. Both entries stay REGISTERED -- struck is not
# deleted, and `cell_info --class 32ch` still resolves, so taking the step-up
# branch needs no edit to THIS file.
