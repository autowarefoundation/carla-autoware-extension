# `32ch` and `128ch` STRUCK 2026-07-30 by the owner's core-duel scope cut: the
# M4 LiDAR-load sweep is reduced to a ceiling CONFIRMATION at the duel size,
# so `vlp16` is the class this campaign measures FIRST. Owner time-budget, on
# the two measurements README's 2026-07-30 amendment states -- the duel size
# already consumes 91% of 24 cores with perception off, so the sweep's premise
# (baseline below the ceiling, heavier classes probing upward) is likely false
# at its starting point; and Task 16's margin formula consumes only the duel
# size, so the other two sizes were sweep context and go with the sweep.
# NOT infeasibility: both classes are ordinary sensor configurations and
# either would have run.
#
# BOTH BRANCHES ARE PRE-REGISTERED HERE, because which one applies is decided
# MECHANICALLY BY THE DATA -- the campaign's standing rule, the same one the
# `ladder_branch` / `abs_pose_gate_m` pair above follows, and the reason the
# `-hf` cells' rate bindings stay null rather than guessing. The M4 claim's
# second registered falsifier is "Whether the M4 ceiling criterion actually
# fires at vlp16" (README, "Registered claim (Task 13)"), so:
#
#   ceiling criterion FIRES at vlp16   -> `vlp16` alone is SUFFICIENT. The
#     spec's M4 success criterion is a fired ceiling criterion OR the 128-ch
#     class, and the first disjunct is met, so no step-up is needed and both
#     struck classes stay struck. This is the branch the strike assumes.
#   ceiling criterion DOES NOT FIRE at vlp16 -> the claim is FALSIFIED and the
#     ceiling has not been located, so a STEP-UP class is needed to find where
#     it is. `32ch` is that step-up, pre-registered as such HERE and now.
#     Reinstating it in that case is an ANTICIPATED amendment, not a novel
#     one: the branch and its trigger are registered before any P3 run, so
#     acting on it is not a definition settled after seeing data.
#
# `128ch` stays struck on EITHER branch: once the criterion fires at a lower
# class nothing needs it, and if it does not fire at `vlp16` the informative
# next probe is the adjacent class, not the extreme one.
#
# Recorded as a COMMENT rather than a per-entry `dropped:` field, unlike the
# cells above: `cell_info.merge` copies every non-meta class key into the
# merged cell JSON at TOP level, so a class-level `dropped:` would read there
# as if the CELL were dropped. Both entries stay REGISTERED -- struck is not
# deleted, and `cell_info --class 32ch` still resolves, so taking the step-up
# branch needs no edit to THIS file.
#
# It DOES need operator work, and the record says so rather than implying
# turnkey: both sweep launchers REFUSE a --class whose sensor arguments are not
# spelled out, because nothing maps a class id onto them
# (cells/tier4-native.sh's BENCH_TIER4_SWEEP_ARGS refusal, cells/extension.sh's
# BENCH_RUNNER_SWEEP_ARGS one -- a sweep run that quietly used the baseline
# VLP16 rig would be filed as a 32ch measurement). That mapping was owed to
# Task 26, which is struck, so it has NO owner now and the refusal stands until
# someone writes it. So reinstating `32ch` is a DECISION rather than an
# amendment -- which is what "anticipated" means above -- but not a decision
# with zero operator cost.
#
# `B-cyc` ADDED TO EVERY `applies_to` 2026-08-03 (P4 whole-branch review,
# blocker B1). Registering B-cyc as a CELL (Task 4) did not register it as a
# SWEEP TARGET, and the two are not the same thing: `cell_info.merge` raises
# `UnknownIdError` for a class whose `applies_to` omits the cell, and run.sh
# resolves the merged cell JSON BEFORE `--check-args` returns -- so
# `run.sh B-cyc --arm paced --class vlp16` and `--arm ablation --class vlp16`
# both refused outright, i.e. the P4 sweep's own two collection tasks could not
# run against the one cell P4 exists to sweep. The three lanes that built P4
# were file-disjoint by construction and this registration fell between them;
# the clean textual merge hid it.
#
# All THREE classes, not only `vlp16`, and the distinction is the one this
# block already draws: `applies_to` records which cells a class is DEFINED
# for, while which classes the campaign RUNS is scope, recorded in the strike
# comment above. B-cyc is cell B's rig exactly -- same fork tree, same
# launcher, same sensor arguments; only the DDS transport differs, and a sweep
# class pins `channels`/`points_per_second` only -- so any class defined for B
# is defined for B-cyc by construction. Nothing is un-struck here: `32ch`
# remains the pre-registered step-up, `128ch` remains struck on either branch,
# and both launchers still refuse `128ch` for want of a sensor-argument
# mapping.
sweep_classes:
  - { id: vlp16, channels: 16, points_per_second: 288000, applies_to: [A, B, B-cyc, E] }
  - { id: 32ch, channels: 32, points_per_second: 1200000, applies_to: [A, B, B-cyc, E] }
  - { id: 128ch, channels: 128, points_per_second: 4600000, applies_to: [A, B, B-cyc, E] }
sweep_arms: [paced, unpaced, ablation] # ablation = publish-disabled baseline
