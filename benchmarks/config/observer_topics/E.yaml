# bench_observer topic list for cell E (python-bridge approach).
#
# The LiDAR entry is the BRIDGE'S AS-EMITTED topic, measured, not
# assumed -- and for THIS cell it is no longer the shipped name.
# Task 10's 0002-sensor-config-harmonized.patch sets the bridge's
# `topic_suffix` to /pointcloud_raw_ex (the spec's injection topic in
# every cell) and moves carla_sensor_kit_launch's crop_box_filter_self
# input to match, so the patched bridge emits
# /sensing/lidar/top/pointcloud_raw_ex. Cell E0, which runs the
# UNPATCHED image, still emits /pointcloud_before_sync and its own
# topic list says so -- the three E-family lists are deliberately NOT
# identical any more. Re-grounded live in Task 10 (see that task's
# report and patches/python-bridge/README.md, "Cell E bring-up gate"),
# which is what the previous revision of this comment deferred.
#
# PublishedTime topics are NOT listed here yet. They are appended in
# Tasks 13/20, after live discovery on the running stack
# (`ros2 topic list | grep published_time`) -- a pre-P3 registration step,
# because a guessed name records silence as "no publisher-side stamps"
# rather than as a wrong topic. On the pinned universe-devel-cuda image the
# message is autoware_internal_msgs/msg/PublishedTime (verified against the
# image; NOT autoware_internal_debug_msgs), so an appended line reads:
#   - "<topic>|autoware_internal_msgs/msg/PublishedTime|published_time"
#
# Format: "<topic>|<type>|<kind>", kind in generic|odometry|published_time
# (benchmarks/observer/src/bench_observer.cpp). `generic` records
# serialized size; `odometry` also writes odometry.csv (size 0 sentinel).
# out_dir is supplied by run.sh as -p out_dir:=/out, not from this file.
/**:
  ros__parameters:
    topics:
      - /sensing/lidar/top/pointcloud_raw_ex|sensor_msgs/msg/PointCloud2|generic
      - /localization/pose_estimator/pose_with_covariance|geometry_msgs/msg/PoseWithCovarianceStamped|generic
      - /localization/kinematic_state|nav_msgs/msg/Odometry|odometry
      - /control/command/control_cmd|autoware_control_msgs/msg/Control|generic
